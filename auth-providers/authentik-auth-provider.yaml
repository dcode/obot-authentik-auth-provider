name: "Authentik"
command: "authentik-auth-provider/bin/obot-provider"
icon: "https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/authentik.svg"
description: "Auth provider for Authentik"
link: "https://goauthentik.io/"
requiredConfigurationParameters:
  - name: "OBOT_AUTHENTIK_AUTH_PROVIDER_CLIENT_ID"
    friendlyName: "Client ID"
    description: "Client ID for the Authentik OAuth2/OpenID Provider backing this application."
    sensitive: false
  - name: "OBOT_AUTHENTIK_AUTH_PROVIDER_CLIENT_SECRET"
    friendlyName: "Client Secret"
    description: "Client secret for the Authentik OAuth2/OpenID Provider backing this application."
    sensitive: true
  - name: "OBOT_AUTHENTIK_AUTH_PROVIDER_ISSUER_URL"
    friendlyName: "Issuer URL"
    description: "The OIDC issuer URL for the Authentik application, e.g. https://auth.example.com/application/o/obot/"
    sensitive: false
  - name: "OBOT_AUTHENTIK_AUTH_PROVIDER_API_URL"
    friendlyName: "Authentik API URL"
    description: "Base URL of the Authentik instance used for group-directory lookups, e.g. https://auth.example.com"
    sensitive: false
  - name: "OBOT_AUTHENTIK_AUTH_PROVIDER_API_TOKEN"
    friendlyName: "Authentik API Token"
    description: "API token for a dedicated, read-only Authentik service account. Used to list/resolve groups and look up a user's group memberships. Create it under Directory > Tokens."
    sensitive: true
  - name: "OBOT_AUTH_PROVIDER_COOKIE_SECRET"
    friendlyName: "Cookie Secret"
    description: "Secret used to encrypt cookies. Must be a random string of length 16, 24, or 32."
    sensitive: true
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_EMAIL_DOMAINS"
    friendlyName: "Allowed E-Mail Domains"
    description: "A list of email domains that are allowed to authenticate with this provider. * is a special value that allows all domains."
    sensitive: false
optionalConfigurationParameters:
  - name: "OBOT_AUTHENTIK_AUTH_PROVIDER_GROUPS_CLAIM"
    friendlyName: "Groups Claim Name"
    description: "Name of the ID token claim carrying the user's group names. Default: groups. Set this to reuse an existing custom scope/claim mapping (e.g. one already named k8s_groups for another application) instead of adding a new one named 'groups'."
    sensitive: false
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_CONNECTION_DSN"
    friendlyName: "PostgreSQL connection string (DSN)"
    description: "The connection string for a PostgreSQL database to use for session storage. If unset, cookies will be used for session storage instead."
    sensitive: true
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_MAX_CONNECTIONS"
    friendlyName: "PostgreSQL max open connections"
    description: "The maximum number of open connections to the PostgreSQL database."
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_MAX_IDLE_CONNECTIONS"
    friendlyName: "PostgreSQL max idle connections"
    description: "The maximum number of idle connections to the PostgreSQL database."
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_POSTGRES_CONNECTION_LIFETIME_SECONDS"
    friendlyName: "PostgreSQL connection lifetime"
    description: "The maximum lifetime of a PostgreSQL database connection, in seconds."
    sensitive: false
    hidden: true
  - name: "OBOT_AUTH_PROVIDER_TOKEN_REFRESH_DURATION"
    friendlyName: "Token Refresh Duration"
    description: "Time to wait before attempting to refresh auth tokens. Should be in a format like 1h1m1s. Default: 1h"
    sensitive: false
  - name: "OBOT_AUTH_PROVIDER_ENABLE_LOGGING"
    friendlyName: "Enable Logging"
    description: "Set to true to enable request, auth, and standard logging for the auth provider. Default: false"
    sensitive: false
postgresTablePrefix: "authentik_"
groupIDPrefix: "authentik/"
